<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one column, phone first. Verdict on top, tide chart under it, detail below. Bottom tab bar. */
:root{
  --bg:#eef2f1; --panel:#ffffff; --ink:#10242b; --muted:#5b6f76; --line:#d5dfdd;
  --accent:#0b6e7f; --accent-ink:#ffffff; --water:#9fd3dc;
  --prime:#d98a00; --good:#1f8a70; --fair:#8aa0a6; --poor:#cfd8d9; --bad:#b83a2b; --night:#dfe6ea;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b181d; --panel:#12262d; --ink:#e4eef0; --muted:#93a9af; --line:#24404a;
  --accent:#4fc3d0; --accent-ink:#06222a; --water:#1f5a68;
  --prime:#f0a92b; --good:#3fc49f; --fair:#5f7880; --poor:#2b424a; --bad:#ef7a68; --night:#0e2027;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);padding-bottom:84px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.25rem;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
h3{font-size:1.2rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px}
.spotbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.spotbtn b{display:block;font:600 1.5rem/1.1 var(--display);overflow-wrap:anywhere}
.spotbtn span{font-size:.8rem;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.note{font-size:.85rem;color:var(--muted)}
.warn{border-left:4px solid var(--bad);padding:8px 10px;background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:6px;font-size:.9rem}
.verdict{display:flex;gap:14px;align-items:center}
.score{font:700 3.2rem/1 var(--display);font-variant-numeric:tabular-nums;min-width:74px;text-align:center;border-radius:10px;padding:8px 6px;color:#fff}
.s-prime{background:var(--prime)} .s-good{background:var(--good)} .s-fair{background:var(--fair)} .s-poor{background:var(--poor);color:var(--ink)}
.verdict h3{font-size:1.6rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.up{border-color:var(--good);color:var(--good)} .chip.down{border-color:var(--bad);color:var(--bad)}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.days button{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-family:var(--display);font-size:1rem;line-height:1.1;text-align:center}
.days button small{display:block;font-family:var(--body);font-size:.7rem;color:var(--muted)}
.days button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.days button.sel small{color:inherit}
svg{display:block;width:100%;height:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
.stat b{font:600 1.35rem/1.2 var(--display);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:.8rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.fish{display:flex;flex-direction:column;gap:6px;border-left:5px solid var(--fair);padding-left:10px}
.fish.peak{border-color:var(--prime)} .fish.on{border-color:var(--good)}
.fish .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.fish dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.9rem}
.fish dt{color:var(--muted)} .fish dd{margin:0}
form{display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 130px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}.check input{width:auto}
.bar{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:.85rem}
.bar i{display:block;height:10px;border-radius:3px;background:var(--accent)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.item{border-bottom:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:3px}
.item:last-child{border-bottom:0}
.item .meta{font-size:.78rem;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{border:1px solid var(--line);border-radius:8px;padding:7px 10px;text-decoration:none;font-size:.9rem;background:var(--bg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:144px;background:none;border:0;border-top:3px solid transparent;padding:10px 4px 12px;cursor:pointer;font:600 1.05rem var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
nav.tabs button.sel{color:var(--accent);border-top-color:var(--accent)}
details summary{cursor:pointer;color:var(--accent);font-size:.9rem}
.banner{background:var(--prime);color:#1b1200;text-align:center;font-weight:600;padding:4px}
@media (prefers-reduced-motion:no-preference){.btn,.chip,nav.tabs button{transition:background .15s,color .15s}}
</style>
</head>
<body>
<div id="banner"></div>
<header class="top"><div class="wrap">
  <button class="spotbtn" id="spotbtn" aria-label="Change spot"><b id="spotname">…</b><span id="spotsub"></span></button>
  <button class="btn ghost small" id="refresh">Refresh</button>
</div></header>
<main class="wrap" id="view" style="padding-top:16px"></main>
<nav class="tabs" id="tabs"></nav>

<script id="core">
/* ---------- Pure logic: time, astronomy, tides, scoring. No DOM. ---------- */
const RAD=Math.PI/180, DAY=864e5, HR=36e5;let TZ=10*HR; // local offset of the spot being shown; set from the forecast service
function parts(ms){const d=new Date(ms+TZ);return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),h:d.getUTCHours(),mi:d.getUTCMinutes(),dow:d.getUTCDay()}}
function midnight(ms){return Math.floor((ms+TZ)/DAY)*DAY-TZ}
function fmtTime(ms){if(ms==null)return'–';const p=parts(ms+30000);return(p.h%12||12)+':'+String(p.mi).padStart(2,'0')+(p.h<12?' am':' pm')}
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(ms){const p=parts(ms);return DOW[p.dow]+' '+p.d+' '+MON[p.m-1]}
function compass(deg){return['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(((deg%360)+360)%360/22.5)%16]}
function angDiff(a,b){return Math.abs(((a-b+540)%360)-180)}

// Sun and moon positions (standard low-precision formulae, good to a few minutes)
const OBL=RAD*23.4397;
function jd(ms){return ms/DAY-0.5+2440588-2451545}
function rAsc(l,b){return Math.atan2(Math.sin(l)*Math.cos(OBL)-Math.tan(b)*Math.sin(OBL),Math.cos(l))}
function decl(l,b){return Math.asin(Math.sin(b)*Math.cos(OBL)+Math.cos(b)*Math.sin(OBL)*Math.sin(l))}
function sunC(d){const M=RAD*(357.5291+0.98560028*d),C=RAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M)),L=M+C+RAD*102.9372+Math.PI;return{ra:rAsc(L,0),dec:decl(L,0)}}
function moonC(d){const L=RAD*(218.316+13.176396*d),M=RAD*(134.963+13.064993*d),F=RAD*(93.272+13.229350*d),l=L+RAD*6.289*Math.sin(M),b=RAD*5.128*Math.sin(F);return{ra:rAsc(l,b),dec:decl(l,b),dist:385001-20905*Math.cos(M)}}
function altOf(c,d,lat,lon){const H=RAD*(280.16+360.9856235*d)+RAD*lon-c.ra,phi=RAD*lat;return Math.asin(Math.sin(phi)*Math.sin(c.dec)+Math.cos(phi)*Math.cos(c.dec)*Math.cos(H))/RAD}
function sunAlt(ms,lat,lon){const d=jd(ms);return altOf(sunC(d),d,lat,lon)}
function moonAlt(ms,lat,lon){const d=jd(ms);return altOf(moonC(d),d,lat,lon)}
function moonPhase(ms){const d=jd(ms),s=sunC(d),m=moonC(d),sd=149598000,
  phi=Math.acos(Math.sin(s.dec)*Math.sin(m.dec)+Math.cos(s.dec)*Math.cos(m.dec)*Math.cos(s.ra-m.ra)),
  inc=Math.atan2(sd*Math.sin(phi),m.dist-sd*Math.cos(phi)),
  ang=Math.atan2(Math.cos(s.dec)*Math.sin(s.ra-m.ra),Math.sin(s.dec)*Math.cos(m.dec)-Math.cos(s.dec)*Math.sin(m.dec)*Math.cos(s.ra-m.ra));
  return{frac:(1+Math.cos(inc))/2,phase:0.5+0.5*inc*(ang<0?-1:1)/Math.PI}}
function phaseName(p){const n=['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];
  if(p<0.03||p>0.97)return n[0];if(p<0.22)return n[1];if(p<0.28)return n[2];if(p<0.47)return n[3];if(p<0.53)return n[4];if(p<0.72)return n[5];if(p<0.78)return n[6];return n[7]}
// Rise/set and highest/lowest points of a body over [t0,t1], sampled every 5 minutes
function bodyEvents(fn,t0,t1,horizon){const step=5*60000,ev={rise:[],set:[],top:[],bottom:[]};let p2=null,p1=null,tp=0;
  for(let t=t0-step;t<=t1+step;t+=step){const a=fn(t);
    if(p1!==null){ if(p1<horizon&&a>=horizon)ev.rise.push(tp+step*(horizon-p1)/(a-p1)); if(p1>=horizon&&a<horizon)ev.set.push(tp+step*(p1-horizon)/(p1-a));
      if(p2!==null){ if(p1>p2&&p1>=a)ev.top.push(tp); if(p1<p2&&p1<=a)ev.bottom.push(tp);} }
    p2=p1;p1=a;tp=t}
  const inR=x=>x>=t0&&x<t1;for(const k in ev)ev[k]=ev[k].filter(inR);return ev}

  return{sunrise:s.rise[0]??null,sunset:s.set[0]??null,moonrise:m.rise[0]??null,moonset:m.set[0]??null,majors:[...m.top,...m.bottom].sort((a,b)=>a-b),minors:[...m.rise,...m.set].sort((a,b)=>a-b),phase:ph.phase,frac:ph.frac}}

// Tides from an hourly sea-level series
function tideExtremes(t,h){let out=[];for(let i=1;i<h.length-1;i++){const a=h[i-1],b=h[i],c=h[i+1];if(a==null||b==null||c==null)continue;
    const hi=b>a&&b>=c,lo=b<a&&b<=c;if(!hi&&!lo)continue;const den=a-2*b+c,off=den?Math.max(-.5,Math.min(.5,0.5*(a-c)/den)):0;
    out.push({t:t[i]+off*HR,h:b-0.25*(a-c)*off,type:hi?'high':'low'})}
  for(let i=out.length-2;i>=0;i--){if(out[i+1]&&out[i+1].t-out[i].t<2*HR&&Math.abs(out[i+1].h-out[i].h)<0.05)out.splice(i,2)} // drop ripples
  return out}
function at(t,v,ms){if(!t||!v||!t.length)return null;const x=(ms-t[0])/HR,i=Math.floor(x);if(i<0||i>=t.length-1)return i===t.length-1&&x===i?v[i]:null;const a=v[i],b=v[i+1];if(a==null||b==null)return a??b??null;return a+(b-a)*(x-i)}
function tideState(ms,ext){let prev=null,next=null;for(const e of ext){if(e.t<=ms)prev=e;else{next=e;break}}
  if(!prev&&!next)return null;const near=[prev,next].filter(Boolean).sort((a,b)=>Math.abs(a.t-ms)-Math.abs(b.t-ms))[0];
  if(Math.abs(near.t-ms)<=45*60000)return{state:near.type,prev,next,near};
  const rising=next?next.type==='high':prev.type==='low';return{state:rising?'rising':'falling',prev,next,near}}
function lightState(ms,a){if(a.sunrise!=null&&Math.abs(ms-a.sunrise)<=90*60000)return'dawn';if(a.sunset!=null&&Math.abs(ms-a.sunset)<=90*60000)return'dusk';
  if(a.sunrise!=null&&a.sunset!=null)return ms>a.sunrise&&ms<a.sunset?'day':'night';return'day'}

/* Bite score, 0-100. A rule-of-thumb model built from common beach-fishing practice; weights are listed in the app. */
function hourScore(ms,c,sp){const P=[],add=(l,d)=>{if(d)P.push({l,d:Math.round(d)})};let s=30;
  const a=c.astro(ms),ls=lightState(ms,a);
  if(c.ext&&c.ext.length){const ts=tideState(ms,c.ext),h1=at(c.mt,c.sea,ms+HR/2),h0=at(c.mt,c.sea,ms-HR/2);
    if(h1!=null&&h0!=null&&c.maxRate){add(h1>h0?'Tide running in':'Tide running out',14*Math.min(1,Math.abs(h1-h0)/c.maxRate))}
    if(ts&&Math.abs(ts.near.t-ms)<=60*60000)add('Turn of the '+ts.near.type+' tide',8);
    if(sp&&ts&&sp.tide.includes(ts.state))add(sp.name+' like this tide',12)}
  const dSun=Math.min(a.sunrise!=null?Math.abs(ms-a.sunrise):1e12,a.sunset!=null?Math.abs(ms-a.sunset):1e12);
  if(dSun<90*60000)add(ls==='dawn'?'Around first light':'Around dusk',18*(1-dSun/(90*60000)));else if(sunAlt(ms,c.lat,c.lon)>40)add('High sun',-4);
  if(sp&&sp.light.includes(ls)&&ls!=='day')add(sp.name+' feed at '+ls,10);
  if(a.majors.some(t=>Math.abs(t-ms)<=60*60000))add('Moon overhead or underfoot',8);else if(a.minors.some(t=>Math.abs(t-ms)<=45*60000))add('Moonrise or moonset',5);
  if(Math.min(a.phase,1-a.phase)<0.07||Math.abs(a.phase-.5)<0.07)add('Bigger tides near new or full moon',4);
  const w=at(c.wt,c.wind,ms),wd=at(c.wt,c.wdir,ms);
  if(w!=null){add(w<10?'Light wind':w<15?'Moderate wind':w<20?'Fresh wind':w<25?'Strong wind':'Very strong wind',w<10?8:w<15?3:w<20?-6:w<25?-14:-25);
    if(c.faces!=null&&wd!=null){const d=angDiff(wd,c.faces);if(d<60&&w>=12)add('Onshore wind',-6);else if(d>120&&w>=6)add('Offshore wind',3)}}
  const wv=at(c.mt,c.wave,ms);
  if(wv!=null&&(c.type==='surf'||c.type==='rocks'))add(wv<0.3?'Flat, clear water':wv<=1.5?'Workable swell':wv<=2.5?'Big swell':'Dangerous swell',wv<0.3?-3:wv<=1.5?6:wv<=2.5?-5:-18);
  const p1=at(c.wt,c.pres,ms),p0=at(c.wt,c.pres,ms-3*HR);if(p1!=null&&p0!=null){if(p1-p0<-1.5)add('Falling barometer',4);else if(p1-p0>2.5)add('Barometer jumping',-3)}
  const r=at(c.wt,c.rain,ms);if(r!=null&&r>2)add('Heavy rain',-6);
  for(const p of P)s+=p.d;return{score:Math.max(0,Math.min(100,Math.round(s))),parts:P,light:ls}}
function grade(s){return s>=70?['Prime','prime']:s>=55?['Good','good']:s>=40?['Fair','fair']:['Poor','poor']}
function bestWindow(hrs){let best=null;for(let i=0;i<hrs.length-1;i++){const a=(hrs[i].score+hrs[i+1].score)/2;if(!best||a>best.avg)best={start:hrs[i].t,end:hrs[i].t+2*HR,avg:Math.round(a)}}return best}
function region(lat){return lat>-19.5?'n':lat>-24.5?'c':lat>-33?'s':'t'}
const mm=(a,b)=>{const o=[];for(let i=a;;i=i%12+1){o.push(i);if(i===b)break}return o},ALL=mm(1,12);
/* Species. Limits marked v:1 were read from the Qld Government tidal limits page (updated 25 Sep 2026). Others say to check. */
const FISH=[
{id:'whiting',name:'Sand whiting',aka:'summer whiting',reg:'scnt',hab:['surf','estuary','bay'],peak:mm(9,4),on:ALL,tide:['rising','low'],light:['dawn','dusk','day'],bait:'Live beach worms first, then yabbies, pipis, soldier crabs',tip:'Light line, long-shank size 4 hook, smallest sinker that holds. Fish the shallow edge of the gutter, not the far side.',limit:'Min 23 cm. Combined limit 30 with goldenline and northern whiting.',v:1},
{id:'dart',name:'Swallowtail dart',aka:'dart',reg:'scn',hab:['surf'],peak:mm(10,4),on:ALL,tide:['rising','high'],light:['day','dawn','dusk'],bait:'Pipis, beach worms, small strips of pilchard',tip:'They sit in the white water behind the shore break. Cast short and keep the bait moving.',limit:'Min 30 cm. Limit 30.',v:1},
{id:'bream',name:'Yellowfin bream',aka:'bream',reg:'scnt',hab:['surf','rocks','estuary','bay'],peak:mm(5,8),on:ALL,tide:['rising','high'],light:['dusk','night','dawn'],bait:'Mullet gut, chicken gut, prawns, pilchard fillet, yabbies',tip:'Fish close to rock and reef edges on the top half of the tide. Winter is the spawning run along the surf.',limit:'Min 25 cm. Combined limit 30 with pikey bream and tarwhine.',v:1},
{id:'tarwhine',name:'Tarwhine',aka:'',reg:'st',hab:['surf','rocks'],peak:mm(5,9),on:ALL,tide:['rising','high'],light:['dawn','dusk','day'],bait:'Beach worms, pipis, prawns',tip:'Turns up beside rocks at the ends of beaches while you are chasing bream or whiting.',limit:'Min 25 cm. Counts in the combined bream limit of 30.',v:1},
{id:'flathead',name:'Dusky flathead',aka:'lizard',reg:'sct',hab:['surf','estuary','bay'],peak:mm(9,11),on:ALL,tide:['falling','low'],light:['dawn','dusk','day'],bait:'Soft plastics, whitebait, pilchards, live herring or poddy mullet',tip:'Work the drop-off where water drains off a bank on the last of the run-out. Keep the bait or lure on the bottom.',limit:'Min 40 cm, max 75 cm. Limit 5.',v:1},
{id:'tailor',name:'Tailor',aka:'choppers, greenbacks',reg:'st',hab:['surf','rocks'],peak:mm(6,9),on:mm(4,11),tide:['rising','high'],light:['dawn','dusk','night'],bait:'Pilchards on ganged 4/0 hooks, metal slugs, bonito strips',tip:'Deep gutters with a clear exit to sea, at first and last light. Use a short wire or heavy mono trace.',limit:'Min 35 cm. Limit 20.',v:1},
{id:'mulloway',name:'Mulloway',aka:'jewfish, jew',reg:'st',hab:['surf','rocks','estuary'],peak:mm(5,9),on:ALL,tide:['high','low'],light:['night','dusk'],bait:'Live mullet, fresh squid, big bunches of beach worms, tailor fillet',tip:'Fish the slack water either side of a tide change after dark, beside rock at the end of a beach.',limit:'Min 75 cm. Limit 2.',v:1},

  else if(b.id==='here'){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{$('#a-lat').value=p.coords.latitude.toFixed(4);$('#a-lon').value=p.coords.longitude.toFixed(4)},()=>{b.textContent='Location not available'})}
  else if(d.dellog){S.log=S.log.filter(x=>x.id!==d.dellog);save();render()}
  else if(d.delnote){S.notes=S.notes.filter(x=>String(x.ts)!==d.delnote);save();render()}
  else if(b.id==='reddit'){reddit='loading';render();try{const j=await getJSON('https://www.reddit.com/search.json?raw_json=1&sort=new&t=month&limit=12&q='+encodeURIComponent('('+(spot().keywords||spot().name)+') fishing'));reddit=j.data.children.map(c=>c.data)}catch(x){reddit='fail'}render()}
  else if(b.id==='exp'){const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),spots:S.spots,log:S.log,notes:S.notes,reports:S.reports},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='run-in-backup.json';a.click()}
  else if(b.id==='csv'){const rows=[['when','spot','species','count','length_cm','kept','bait','tide','wind_kn','wind_dir','wave_m','moon','score','notes'],...S.log.map(x=>[new Date(x.ts+TZ).toISOString().slice(0,16),x.spotName,x.species,x.n,x.len,x.kept?'y':'n',x.bait,x.cond?.tide,x.cond?.wind,x.cond?.wdir,x.cond?.wave?.toFixed?.(1),x.cond?phaseName(x.cond.phase):'',x.cond?.score,x.notes])];
    const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');try{await navigator.clipboard.writeText(csv);b.textContent='Copied'}catch(x){b.textContent='Copy blocked'}}
});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
  if(f.id==='logform'){const ts=Date.parse($('#l-when').value+':00Z')-TZ,sp=spot(),species=$('#l-species').value,len=parseFloat($('#l-len').value)||null;
    S.log.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts,spotId:sp.id,spotName:sp.name,species,n:species?(parseInt($('#l-n').value)||1):0,len:species?len:null,kept:species?$('#l-kept').checked:false,bait:$('#l-bait').value.trim(),notes:$('#l-notes').value.trim(),cond:condAt(ts)});save();render()}
  else if(f.id==='noteform'){const txt=$('#notetext').value.trim();let added=0;
    try{const m=txt.match(/\[[\s\S]*\]/);if(m){const arr=JSON.parse(m[0]);if(Array.isArray(arr))for(const r of arr)if(r&&r.summary){S.reports.push({date:String(r.date||''),source:String(r.source||''),area:String(r.area||''),url:String(r.url||''),summary:String(r.summary)});added++}}}catch(x){}
    if(!added)S.notes.push({spot:spot().id,ts:Date.now(),text:txt});save();render()}
  else if(f.id==='searchform'){const q=$('#q').value.trim();found='loading';render();try{const j=await getJSON('https://geocoding-api.open-meteo.com/v1/search?count=20&language=en&format=json&countryCode=AU&name='+encodeURIComponent(q));found=(j.results||[]).slice(0,12)}catch(x){found='fail'}render();const i=$('#q');if(i)i.value=q}
  else if(f.id==='addform'){const lat=parseFloat($('#a-lat').value),lon=parseFloat($('#a-lon').value),fa=$('#a-faces').value,id='s'+Date.now().toString(36);
    S.spots.push({id,name:$('#a-name').value.trim(),area:$('#a-area').value.trim(),state:stateOf({area:$('#a-area').value,lat,lon}),lat,lon,type:$('#a-type').value,faces:fa===''?null:+fa,keywords:$('#a-kw').value.trim()||$('#a-name').value.trim(),local:[]});S.active=id;found=null;save();tab='today';dayIdx=0;reddit=null;load(true)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='imp'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);const ids=new Set(S.log.map(x=>x.id));for(const x of o.log||[])if(!ids.has(x.id))S.log.push(x);const sid=new Set(S.spots.map(s=>s.id));for(const s of o.spots||[])if(!sid.has(s.id))S.spots.push(s);for(const n of o.notes||[])if(!S.notes.some(y=>y.ts===n.ts))S.notes.push(n);for(const n of o.reports||[])S.reports.push(n);save();render()}catch(x){}};r.readAsText(e.target.files[0])}
  if(['l-species','l-len','l-kept'].includes(e.target.id)){const f=FISH.find(x=>x.name===$('#l-species').value),len=parseFloat($('#l-len').value),w=$('#l-warn');if(!w)return;const mn=f&&/Min (\d+)/.exec(f.limit),mx=f&&/max (\d+)/.exec(f.limit);
    w.innerHTML=isQld(spot())&&$('#l-kept').checked&&len&&((mn&&len<+mn[1])||(mx&&len>+mx[1]))?`<p class="warn">${esc(f.name)} at ${len} cm is outside the legal size. ${esc(f.limit)}</p>`:''}
});
// Hosted copy: pick up a reports.json sitting beside the page
if(location.protocol.startsWith('http'))fetch('reports.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(a=>{if(Array.isArray(a)){const have=new Set(S.reports.map(r=>r.date+'|'+r.summary));for(const r of a)if(r&&r.summary&&!have.has(r.date+'|'+r.summary))S.reports.push(r);save();if(tab==='reports')render()}}).catch(()=>{});
build();render();load(false);
</script>
</body>
</html>
